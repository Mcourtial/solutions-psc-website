html, body { margin: 0; background: #000; }
canvas { display: block; }
body.preview { display: grid; place-items: center; min-height: 100vh; font: 12px ui-monospace, monospace; color: #9DB4E8; }
body.preview canvas { width: min(100vw, calc((100vh - 56px) * 16 / 9)); height: auto; }
#ui { display: none; gap: 12px; align-items: center; width: min(100vw, calc((100vh - 56px) * 16 / 9)); padding: 12px 0; }
body.preview #ui { display: flex; }
#ui input { flex: 1; }
#ui button { background: #1B3160; color: #fff; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="play">⏸</button><input id="scrub" type="range" min="0" max="30" step="0.001" value="0"><span id="tc">0.000</span></div>
<script type="module" src="main.js"></script>
</body>
